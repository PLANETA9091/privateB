name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_fleet:
        description: 'Run the big fleet test too'
        required: false
        default: 'false'
      fleet_seconds:
        description: 'Big fleet duration in seconds (default 300)'
        required: false
        default: '300'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unit:
    name: Unit tests (no server needed)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Patch the PrismarineJS stack for Minecraft 26.2
        run: node scripts/setup-26.2.mjs

      - name: Syntax-check every module
        run: node scripts/check-syntax.mjs

      - name: Unit tests
        run: node scripts/run-tests.mjs unit

  integration:
    name: Integration (vanilla 26.2 server + fleet)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MC_HOST: 127.0.0.1
      MC_PORT: 25565
      FLEET_TEST_BOTS: '2'
      FLEET_TEST_SECONDS: '90'
      FLEET_TEST_MIN_BLOCKS: '4'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25' # Minecraft 26.2 needs class file 69

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Patch the PrismarineJS stack for Minecraft 26.2
        run: node scripts/setup-26.2.mjs

      - name: Syntax-check every module
        run: node scripts/check-syntax.mjs

      - name: Cache the vanilla server jar
        id: jar-cache
        uses: actions/cache@v4
        with:
          path: testbed/server/server.jar
          key: mc-server-26.2-823e2250d24b3ddac457a60c92a6a941943fcd6a

      - name: Download the vanilla 26.2 server jar
        if: steps.jar-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSf --max-time 300 -o testbed/server/server.jar \
            "https://piston-data.mojang.com/v1/objects/823e2250d24b3ddac457a60c92a6a941943fcd6a/server.jar"
          echo "823e2250d24b3ddac457a60c92a6a941943fcd6a  testbed/server/server.jar" | sha1sum -c -

      - name: Start the vanilla server (fixed test seed)
        run: scripts/server.sh start

      - name: Wait for the world to settle
        run: sleep 5

      - name: Smoke test (login, chunks, dig, place - survival, no op)
        # No `op` here: on an offline-mode server with internet access the console
        # `op <name>` can bind to a Mojang premium UUID, which never matches the
        # OfflinePlayer UUID the bot joins with. The smoke test digs with bare hands.
        run: node testbed/smoke.mjs 127.0.0.1 25565 BotAlpha

      - name: Unit tests (again, cheap insurance inside the integration env)
        run: node scripts/run-tests.mjs unit

      - name: Fleet productivity test (ground mode, no flight)
        run: node scripts/run-tests.mjs integration

      - name: Deposit probe (the 26.2 chest click ladder, pure evidence)
        # run68 (the first 600s fleet) reached chests and delivered ZERO with the
        # skip reasons swallowed; this rig answers WHY in isolation (one bot, zero
        # load, a console-placed chest, hand-dug dirt). Exit 0 always: evidence,
        # not a gate - the verdict line lands in this job's log.
        run: node testbed/deposit-probe.mjs 127.0.0.1 25565 DepositProbe
        timeout-minutes: 5

      - name: Dump the server console
        if: failure()
        run: tail -80 testbed/server/logs/latest.log || true

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fleet-logs
          path: |
            /tmp/fleet-test-*/
            testbed/server/logs/latest.log
          if-no-files-found: ignore
          retention-days: 5

      - name: Stop the server
        if: always()
        run: scripts/server.sh stop

  fleet:
    name: Big fleet run (19 bots, optional)
    runs-on: ubuntu-latest
    needs: [unit, integration]
    if: github.event_name == 'workflow_dispatch' && inputs.run_fleet == 'true'
    timeout-minutes: 40
    env:
      # The first Big Fleet run OOMed at the default ~4 GB heap cap. Cap it lower
      # so the failure mode is a clean V8 OOM in the log (with the mem: line right
      # above it), not an OS-level kill; the Java server needs its 2 GB headroom.
      NODE_OPTIONS: --max-old-space-size=3584
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: node scripts/setup-26.2.mjs
      - uses: actions/cache@v4
        id: jar-cache-fleet
        with:
          path: testbed/server/server.jar
          key: mc-server-26.2-823e2250d24b3ddac457a60c92a6a941943fcd6a
      - name: Download the server jar
        if: steps.jar-cache-fleet.outputs.cache-hit != 'true'
        run: |
          curl -sSf --max-time 300 -o testbed/server/server.jar \
            "https://piston-data.mojang.com/v1/objects/823e2250d24b3ddac457a60c92a6a941943fcd6a/server.jar"
      - name: Launch the fleet (19 bots, 5 minutes)
        run: |
          set -o pipefail   # an OOM in the fleet process must fail this step, not be masked by tee
          scripts/server.sh start
          sleep 5           # let the world settle (same as the integration job)
          # (v0.17.5) THE MISSING KEYSTONE: the fleet world NEVER had a yard - the
          # chest warehouse, furnace row and crafting tables were never built, so
          # banked=0 smelted=0 in EVERY fleet run (#122..#124: bots held 130-319
          # units, climbed out for 'bank' 15+ times, found 'no chest in range' at
          # ANY distance because the chests did not exist). The yard script surveys
          # world spawn with a throwaway bot and places everything through the
          # server console (infrastructure, not bot gifts - bots stay survival,
          # no op); setworldspawn pins respawns to the yard floor.
          node scripts/setup-yard.mjs
          node --expose-gc testbed/fleet19.mjs 19 ${{ inputs.fleet_seconds || '300' }} sand,gravel,dirt,stone 2>&1 | tee /tmp/fleet19.log
      - name: Upload fleet log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fleet19-log
          path: /tmp/fleet19.log
      - name: Upload server console + log (tick-stall evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fleet-server-log
          path: |
            testbed/server/console.log
            testbed/server/logs/latest.log
      - name: Stop the server
        if: always()
        run: scripts/server.sh stop
